<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080c29">
  <meta name="description" content="SEVOU & SAROK — Apple of Fortune access portal.">
  <title>SEVOU &amp; SAROK — Apple of Fortune</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="apple-root">
    <section class="apple-card" id="portal-card" aria-label="SEVOU and SAROK Apple of Fortune portal">
      <div class="brand-art">
        <img src="media/sevou-sarok-predictor.jpg" alt="SEVOU & SAROK PREDICTOR artwork" width="1024" height="1024">
      </div>
      <h1 class="apple-title">SEVOU <span>&amp;</span> SAROK</h1>
      <p class="apple-sub">APPLE OF FORTUNE <span aria-hidden="true">•</span> ACCESS PORTAL</p>

      <div class="apple-err" id="portal-error" role="alert" aria-live="polite" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2.8 19a1.3 1.3 0 0 0 1.1 2h16.2a1.3 1.3 0 0 0 1.1-2L12 3Z"/><path d="M12 9v4m0 3h.01"/></svg>
        <span id="portal-error-text"></span>
      </div>

      <form id="portal-login-form" novalidate>
        <label class="field-label" for="portal-user-id">USER ID</label>
        <label class="apple-field" for="portal-user-id">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 10h4m-4 4h7m3-4h.01"/></svg>
          <!-- Keep input type=text so a leading space can select the shared Apple board. -->
          <input id="portal-user-id" name="userId" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Your ID " maxlength="24" required aria-label="Your ID">
        </label>

        <label class="field-label" for="portal-access-key">ACTIVATION KEY</label>
        <label class="apple-field" for="portal-access-key">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="5"/><path d="m11.5 11.5 9-9M17 6l2 2m-5 1 2 2"/></svg>
          <input id="portal-access-key" name="accessKey" type="password" autocomplete="off" placeholder="Enter activation key" required aria-label="Activation key">
        </label>

        <button class="apple-btn" id="portal-login-button" type="submit">
          <span class="spinner" hidden></span><span class="button-label">LOGIN</span>
        </button>
        <p class="buy-key"><a id="portal-buy-key" href="https://t.me/razor_1x?text=%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%B4%D8%B1%D8%A7%D8%A1%20code%20%D8%AA%D9%81%D8%B9%D9%8A%D9%84%20%D9%84%D9%80%20Bot%20Apple" target="_blank" rel="noopener noreferrer">Don't have a key? Contact us</a></p>
      </form>

      <section id="portal-game-panel" hidden>
        <div class="session-bar">
          <div class="session-meta"><span>USER ID: <strong id="portal-active-id"></strong></span></div>
          <button class="exit-button" id="portal-exit-button" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l5-5-5-5m5 5H3m9-9h6a3 3 0 0 1 3 3v12a3 3 0 0 1-3 3h-6"/></svg>
            EXIT
          </button>
        </div>
        <div class="board" id="portal-apple-board" aria-label="Apple board" aria-live="polite"></div>
        <button class="apple-btn start-btn" id="portal-start-button" type="button">
          <span class="spinner" hidden></span><span class="button-label"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 12 7-12 7V5Z"/></svg> START</span>
        </button>
      </section>
      <p class="footer-mark">SEVOU &amp; SAROK <span>•</span> SECURE ACCESS</p>
    </section>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
